name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: CLI smoke
        run: |
          python3 -m qrgen.cli "smoke test" --ascii -q 2
          python3 -m qrgen.cli "svg" -o /tmp/out.svg
          python3 -m qrgen.cli -V
